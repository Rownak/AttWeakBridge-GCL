# Sprint 3 Phase 3.3 -- rank_topk.k sweep, ncit_doid (repeat of Phase 2.1).
# Run as: uv run cga sweep --spec configs/sweeps/ncit_doid_rank_topk_k.yaml
#
# fixed: pins SapBERT as the text embedder; the pipeline default is SecRoBERTa, which is not
# the embedder built for ncit_doid. fixed values are excluded from sweep_point_id.
pipeline: training_data
dataset: ncit_doid
fixed:
  training_data.inputs.text_embeddings.embedder_id: hf_mean_pool-sapbert
sweep:
  training_data.sampler.name: [rank_topk]
  training_data.sampler.k: [5, 10, 15]
