# Sprint 3.2 -- ncit_doid counterpart of neighborhood_compare.yaml, run as:
#   cga run evaluate --dataset ncit_doid --experiment ncit_doid_neighborhood_compare
#
# 4 methods: two baseline embedding stores (DeepWalk, SapBERT) and the two trained
# dual-encoders (SapBERT + DeepWalk, rank_topk k=5). ks, views and n_clusters match
# full_grid_compare.yaml so numbers stay comparable with Sprint 2. The textual view's
# reference is the generic bert_base store, kept distinct from the SapBERT method under
# comparison so the relevance set is not defined by one of the competitors.
evaluate:
  methods:
    - {method_id: deepwalk, label: "DeepWalk",         kind: embedding_store, embedder_id: deepwalk-deepwalk,       ref: latest}
    - {method_id: sapbert,  label: "SapBERT",          kind: embedding_store, embedder_id: hf_mean_pool-sapbert,    ref: latest}
    - {method_id: gcn,      label: "Dual-encoder GCN", kind: gcl_run,         model_id: gcn-sapbert-deepwalk,       ref: latest}
    - {method_id: gat,      label: "Dual-encoder GAT", kind: gcl_run,         model_id: gat-sapbert-deepwalk,       ref: latest}
  evaluations:
    - evaluation_id: neigh
      kind: neighborhood
      params:
        ks: [1, 5, 10, 20]
        roles: [graph_1, graph_2]
        views:
          - {view_id: structural_r1, provider: hop_radius, params: {radius: 1}}
          - {view_id: structural_r2, provider: hop_radius, params: {radius: 2}}
          - {view_id: textual, provider: cosine_top_k,
             params: {top_k: 10, reference: {kind: embedding_store, embedder_id: hf_mean_pool-bert_base, ref: latest}}}
    - evaluation_id: clusters
      kind: cluster_quality
      params: {roles: [graph_1, graph_2], n_clusters: [2, 4, 8, 16, 32]}
  visualize: {enabled: true, methods: [gcn, gat]}
