# Sprint 3 Phase 3.3 -- comparative evaluation over 4 of the 6 ncit_doid sampler sweep points
# (rank_topk.k in {5,10,15}, percentile 2%; see the note below for the omitted points), all fixed at
# GCN + SapBERT + DeepWalk, 100 epochs. Run as:
#   cga run evaluate --dataset ncit_doid --experiment ncit_doid_sampler_sweep_compare
#
# Each model_id is gcn-{sweep_point_id}, set explicitly on each gcl_train run via
# --set gcl_train.model.model_id=gcn-<sweep_point_id> so the runs keep separate LATEST pointers.
evaluate:
  methods:
    - {method_id: gcn_rank_topk_k5,    label: "GCN rank_topk k=5",   kind: gcl_run, model_id: gcn-rank_topk-k5,  ref: latest}
    - {method_id: gcn_rank_topk_k10,   label: "GCN rank_topk k=10",  kind: gcl_run, model_id: gcn-rank_topk-k10, ref: latest}
    - {method_id: gcn_rank_topk_k15,   label: "GCN rank_topk k=15",  kind: gcl_run, model_id: gcn-rank_topk-k15, ref: latest}
    - {method_id: gcn_percentile_p02,  label: "GCN percentile 2%",   kind: gcl_run, model_id: "gcn-percentile-top_pct0.02-bottom_pct0.02", ref: latest}
    # percentile 5% (6.6M examples) and 10% (13.1M) are omitted: gcl_train ran out of GPU memory on both.
  evaluations:
    - evaluation_id: neigh
      kind: neighborhood
      params:
        ks: [1, 5, 10, 20]
        roles: [graph_1, graph_2]
        views:
          - {view_id: structural_r1, provider: hop_radius, params: {radius: 1}}
          - {view_id: structural_r2, provider: hop_radius, params: {radius: 2}}
          - {view_id: textual, provider: cosine_top_k,
             params: {top_k: 10, reference: {kind: embedding_store, embedder_id: hf_mean_pool-bert_base, ref: latest}}}
    - evaluation_id: clusters
      kind: cluster_quality
      params: {roles: [graph_1, graph_2], n_clusters: [2, 4, 8, 16, 32]}
