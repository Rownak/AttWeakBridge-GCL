# Sprint 12 Phase 12.6 -- G3 / G5 trained on bottom-5 pseudo-pairs against the cross-modal hard-negative pairs (11.14 sampler), run as:
#   uv run cga run evaluate --dataset attack_cwe_ent --experiment attack_cwe_ent_paper_gated_hard \
#       --set evaluate.inputs.ingest_run=20261027T194643Z-5d3f8baf
# Hard rows use training data run 20261028T023558Z-decc373b (s11c-rank_topk-k5-xhard); the others 20261027T205523Z-ac890ca3. Seed 42.
evaluate:
  methods:
    - {method_id: mpnet-chunk, label: "mpnet-chunk (frozen)", kind: embedding_store, embedder_id: sentence_transformer-multi_qa_mpnet_dot_chunk_desc, ref: 20261027T194928Z-8cf38e55}
    - {method_id: g3,      label: "G3 gated residual (text), bottom-5", kind: gcl_run, model_id: ent-g3-gated-mpnetc-s42,      ref: 20261028T153145Z-bd1e8273}
    - {method_id: g3-hard, label: "G3 gated residual (text), hard",     kind: gcl_run, model_id: ent-g3-gated-hard-mpnetc-s42, ref: 20261028T154340Z-da58604c}
    - {method_id: g5,      label: "G5 gated dual, bottom-5",            kind: gcl_run, model_id: ent-g5-gated-mpnetc-s42,      ref: 20261028T154340Z-fdcd6c82}
    - {method_id: g5-hard, label: "G5 gated dual, hard",                kind: gcl_run, model_id: ent-g5-gated-hard-mpnetc-s42, ref: 20261028T154340Z-18f16e45}
  evaluations:
    - evaluation_id: neigh
      kind: neighborhood
      params:
        ks: [1, 5, 10, 20]
        roles: [graph_1, graph_2]
        views:
          - {view_id: structural_r1, provider: hop_radius, params: {radius: 1}}
          - {view_id: structural_r2, provider: hop_radius, params: {radius: 2}}
          - {view_id: textual, provider: cosine_top_k,
             params: {top_k: 10, reference: {kind: embedding_store, embedder_id: hf_mean_pool-pt_SecRoBERTa_desc, ref: 20261027T200841Z-09088f9f}}}
    - evaluation_id: clusters
      kind: cluster_quality
      params: {roles: [graph_1, graph_2], n_clusters: [2, 4, 8, 16, 32]}
  visualize: {enabled: false}
