# Sprint 12 Phase 12.6 -- seed spread of the gated models (G2, G3, G5 at seeds 42 / 43 / 44) with the Sprint 3 proxy protocol, run as:
#   uv run cga run evaluate --dataset attack_cwe_ent --experiment attack_cwe_ent_paper_gated_seeds \
#       --set evaluate.inputs.ingest_run=20261027T194643Z-5d3f8baf
# Method ids end in `-s<seed>` (scripts/paper_proxy_seed_table.py groups on that suffix). Frozen mpnet-chunk is the reference row.
evaluate:
  methods:
    - {method_id: mpnet-chunk, label: "mpnet-chunk (frozen)", kind: embedding_store, embedder_id: sentence_transformer-multi_qa_mpnet_dot_chunk_desc, ref: 20261027T194928Z-8cf38e55}
    - {method_id: g2-s42, label: "G2 residual, no gate seed 42", kind: gcl_run, model_id: ent-g2-gated-mpnetc-s42, ref: 20261028T154339Z-6f4468f5}
    - {method_id: g2-s43, label: "G2 residual, no gate seed 43", kind: gcl_run, model_id: ent-g2-gated-mpnetc-s43, ref: 20261028T154339Z-24ab4772}
    - {method_id: g2-s44, label: "G2 residual, no gate seed 44", kind: gcl_run, model_id: ent-g2-gated-mpnetc-s44, ref: 20261028T154339Z-6c92f9c0}
    - {method_id: g3-s42, label: "G3 gated residual (text) seed 42", kind: gcl_run, model_id: ent-g3-gated-mpnetc-s42, ref: 20261028T153145Z-bd1e8273}
    - {method_id: g3-s43, label: "G3 gated residual (text) seed 43", kind: gcl_run, model_id: ent-g3-gated-mpnetc-s43, ref: 20261028T154340Z-2f19bae8}
    - {method_id: g3-s44, label: "G3 gated residual (text) seed 44", kind: gcl_run, model_id: ent-g3-gated-mpnetc-s44, ref: 20261028T154339Z-6f657c79}
    - {method_id: g5-s42, label: "G5 gated dual seed 42", kind: gcl_run, model_id: ent-g5-gated-mpnetc-s42, ref: 20261028T154340Z-fdcd6c82}
    - {method_id: g5-s43, label: "G5 gated dual seed 43", kind: gcl_run, model_id: ent-g5-gated-mpnetc-s43, ref: 20261028T154340Z-2bc03e86}
    - {method_id: g5-s44, label: "G5 gated dual seed 44", kind: gcl_run, model_id: ent-g5-gated-mpnetc-s44, ref: 20261028T154340Z-bd006915}
  evaluations:
    - evaluation_id: neigh
      kind: neighborhood
      params:
        ks: [1, 5, 10, 20]
        roles: [graph_1, graph_2]
        views:
          - {view_id: structural_r1, provider: hop_radius, params: {radius: 1}}
          - {view_id: structural_r2, provider: hop_radius, params: {radius: 2}}
          - {view_id: textual, provider: cosine_top_k,
             params: {top_k: 10, reference: {kind: embedding_store, embedder_id: hf_mean_pool-pt_SecRoBERTa_desc, ref: 20261027T200841Z-09088f9f}}}
    - evaluation_id: clusters
      kind: cluster_quality
      params: {roles: [graph_1, graph_2], n_clusters: [2, 4, 8, 16, 32]}
  visualize: {enabled: false}
