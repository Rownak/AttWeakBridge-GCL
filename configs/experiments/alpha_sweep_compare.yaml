# dev_docs/sweep_experiment_plan.md -- comparative evaluation over the 5
# alpha sweep points (gcl_train.loss.alpha in {0.0, 0.25, 0.5, 0.75, 1.0}),
# sampler fixed at Phase 2.1's winner (rank_topk, k=5), GCN + SecRoBERTa +
# DeepWalk, 100 epochs. Run as:
#   cga run evaluate --dataset attack_cwe --experiment alpha_sweep_compare
#
# Each method's model_id matches configs/sweeps/alpha.yaml's zipped
# gcl_train.model.model_id values exactly (gcn-alpha{0,0.25,0.5,0.75,1}), so
# `ref: latest` resolves the run cga sweep just produced
# (dev_docs/sprints/sprint_2.md Phase 2.2).
evaluate:
  methods:
    - {method_id: gcn_alpha_0_00, label: "GCN alpha=0.0 (graph-only)", kind: gcl_run, model_id: gcn-alpha0,    ref: latest}
    - {method_id: gcn_alpha_0_25, label: "GCN alpha=0.25",             kind: gcl_run, model_id: gcn-alpha0.25, ref: latest}
    - {method_id: gcn_alpha_0_50, label: "GCN alpha=0.5 (default)",    kind: gcl_run, model_id: gcn-alpha0.5,  ref: latest}
    - {method_id: gcn_alpha_0_75, label: "GCN alpha=0.75",             kind: gcl_run, model_id: gcn-alpha0.75, ref: latest}
    - {method_id: gcn_alpha_1_00, label: "GCN alpha=1.0 (text-only)",  kind: gcl_run, model_id: gcn-alpha1,    ref: latest}
  evaluations:
    - evaluation_id: neigh
      kind: neighborhood
      params:
        ks: [1, 5, 10, 20]
        roles: [graph_1, graph_2]
        views:
          - {view_id: structural_r1, provider: hop_radius, params: {radius: 1}}
          - {view_id: structural_r2, provider: hop_radius, params: {radius: 2}}
          - {view_id: textual, provider: cosine_top_k,
             params: {top_k: 10, reference: {kind: embedding_store, embedder_id: hf_mean_pool-bert_base, ref: latest}}}
    - evaluation_id: clusters
      kind: cluster_quality
      params: {roles: [graph_1, graph_2], n_clusters: [2, 4, 8, 16, 32]}
