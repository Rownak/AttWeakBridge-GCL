# Sprint 6 Phase 6.1 -- score-level fusion, val only (no test read). A17/A18 seed ensembles, A20 grand ensemble (12 members).
#   uv run cga run evaluate --dataset ncit_doid_srga --experiment ncit_doid_srga_fusion
evaluate:
  methods:
    - {method_id: sapbert, label: "SapBERT (A0)", kind: embedding_store, embedder_id: hf_mean_pool-sapbert, ref: latest}
    - {method_id: "srga-gcn-l0.25-s42", label: "A11 seed 42", kind: gcl_run, model_id: "srga-gcn-l0.25-s42", ref: latest}
    - {method_id: "srga-gcn-l0.25-s43", label: "A11 seed 43", kind: gcl_run, model_id: "srga-gcn-l0.25-s43", ref: latest}
    - {method_id: "srga-gcn-l0.25-s44", label: "A11 seed 44", kind: gcl_run, model_id: "srga-gcn-l0.25-s44", ref: latest}
    - {method_id: "gcn-full-e200-s42", label: "A12 seed 42", kind: gcl_run, model_id: "gcn-full-e200-s42", ref: latest}
    - {method_id: "gcn-full-e200-s43", label: "A12 seed 43", kind: gcl_run, model_id: "gcn-full-e200-s43", ref: latest}
    - {method_id: "gcn-full-e200-s44", label: "A12 seed 44", kind: gcl_run, model_id: "gcn-full-e200-s44", ref: latest}
    - {method_id: "srga-gat-l0.25-s42", label: "A14 seed 42", kind: gcl_run, model_id: "srga-gat-l0.25-s42", ref: latest}
    - {method_id: "srga-gat-l0.25-s43", label: "A14 seed 43", kind: gcl_run, model_id: "srga-gat-l0.25-s43", ref: latest}
    - {method_id: "srga-gat-l0.25-s44", label: "A14 seed 44", kind: gcl_run, model_id: "srga-gat-l0.25-s44", ref: latest}
    - {method_id: "gat-full-e100-s42", label: "A15 seed 42", kind: gcl_run, model_id: "gat-full-e100-s42", ref: latest}
    - {method_id: "gat-full-e100-s43", label: "A15 seed 43", kind: gcl_run, model_id: "gat-full-e100-s43", ref: latest}
    - {method_id: "gat-full-e100-s44", label: "A15 seed 44", kind: gcl_run, model_id: "gat-full-e100-s44", ref: latest}
    - method_id: "A17"
      label: "A17 seed ensemble of A11"
      kind: fusion
      members:
        - {kind: gcl_run, model_id: "srga-gcn-l0.25-s42", ref: latest, weight: 1}
        - {kind: gcl_run, model_id: "srga-gcn-l0.25-s43", ref: latest, weight: 1}
        - {kind: gcl_run, model_id: "srga-gcn-l0.25-s44", ref: latest, weight: 1}
    - method_id: "A18"
      label: "A18 seed ensemble of A12"
      kind: fusion
      members:
        - {kind: gcl_run, model_id: "gcn-full-e200-s42", ref: latest, weight: 1}
        - {kind: gcl_run, model_id: "gcn-full-e200-s43", ref: latest, weight: 1}
        - {kind: gcl_run, model_id: "gcn-full-e200-s44", ref: latest, weight: 1}
    - method_id: "A20"
      label: "A20 grand ensemble (A11+A12+A14+A15)"
      kind: fusion
      members:
        - {kind: gcl_run, model_id: "srga-gcn-l0.25-s42", ref: latest, weight: 1}
        - {kind: gcl_run, model_id: "srga-gcn-l0.25-s43", ref: latest, weight: 1}
        - {kind: gcl_run, model_id: "srga-gcn-l0.25-s44", ref: latest, weight: 1}
        - {kind: gcl_run, model_id: "gcn-full-e200-s42", ref: latest, weight: 1}
        - {kind: gcl_run, model_id: "gcn-full-e200-s43", ref: latest, weight: 1}
        - {kind: gcl_run, model_id: "gcn-full-e200-s44", ref: latest, weight: 1}
        - {kind: gcl_run, model_id: "srga-gat-l0.25-s42", ref: latest, weight: 1}
        - {kind: gcl_run, model_id: "srga-gat-l0.25-s43", ref: latest, weight: 1}
        - {kind: gcl_run, model_id: "srga-gat-l0.25-s44", ref: latest, weight: 1}
        - {kind: gcl_run, model_id: "gat-full-e100-s42", ref: latest, weight: 1}
        - {kind: gcl_run, model_id: "gat-full-e100-s43", ref: latest, weight: 1}
        - {kind: gcl_run, model_id: "gat-full-e100-s44", ref: latest, weight: 1}
  evaluations:
    - evaluation_id: gold_val
      kind: gold_alignment
      params: {ks: [1, 5, 10], split: val, modes: [global]}
