# Sprint 5 Phase 5.3 -- A4 (directional relational adapter) vs A5 (rewired graph) vs A6 (undirected), 3 seeds each,
# with A0, A1 and A3 from earlier phases as references. Val plus train (informational); no test read. Run as:
#   uv run cga run evaluate --dataset ncit_doid_srga --experiment ncit_doid_srga_rel
evaluate:
  methods:
    - {method_id: sapbert, label: "SapBERT (A0)", kind: embedding_store, embedder_id: hf_mean_pool-sapbert, ref: latest}
    - {method_id: "srga-nb-l0.25-dir", label: "A1 nb l=0.25 dir", kind: gcl_run, model_id: "srga-nb-l0.25-dir", ref: latest}
    - {method_id: "srga-mlp-l0.25-s42", label: "A3 seed 42", kind: gcl_run, model_id: "srga-mlp-l0.25-s42", ref: latest}
    - {method_id: "srga-mlp-l0.25-s43", label: "A3 seed 43", kind: gcl_run, model_id: "srga-mlp-l0.25-s43", ref: latest}
    - {method_id: "srga-mlp-l0.25-s44", label: "A3 seed 44", kind: gcl_run, model_id: "srga-mlp-l0.25-s44", ref: latest}
    - {method_id: "srga-rel-l0.25-s42", label: "A4 seed 42", kind: gcl_run, model_id: "srga-rel-l0.25-s42", ref: latest}
    - {method_id: "srga-rel-l0.25-s43", label: "A4 seed 43", kind: gcl_run, model_id: "srga-rel-l0.25-s43", ref: latest}
    - {method_id: "srga-rel-l0.25-s44", label: "A4 seed 44", kind: gcl_run, model_id: "srga-rel-l0.25-s44", ref: latest}
    - {method_id: "srga-rel-rewired-l0.25-s42", label: "A5 seed 42", kind: gcl_run, model_id: "srga-rel-rewired-l0.25-s42", ref: latest}
    - {method_id: "srga-rel-rewired-l0.25-s43", label: "A5 seed 43", kind: gcl_run, model_id: "srga-rel-rewired-l0.25-s43", ref: latest}
    - {method_id: "srga-rel-rewired-l0.25-s44", label: "A5 seed 44", kind: gcl_run, model_id: "srga-rel-rewired-l0.25-s44", ref: latest}
    - {method_id: "srga-rel-undir-l0.25-s42", label: "A6 seed 42", kind: gcl_run, model_id: "srga-rel-undir-l0.25-s42", ref: latest}
    - {method_id: "srga-rel-undir-l0.25-s43", label: "A6 seed 43", kind: gcl_run, model_id: "srga-rel-undir-l0.25-s43", ref: latest}
    - {method_id: "srga-rel-undir-l0.25-s44", label: "A6 seed 44", kind: gcl_run, model_id: "srga-rel-undir-l0.25-s44", ref: latest}
  evaluations:
    - evaluation_id: gold_val
      kind: gold_alignment
      params: {ks: [1, 5, 10], split: val, modes: [global]}
    - evaluation_id: gold_train
      kind: gold_alignment
      params: {ks: [1, 5, 10], split: train, modes: [global]}
