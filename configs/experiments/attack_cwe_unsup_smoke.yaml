# Sprint 9 Phase 9.1 smoke readout (U0, U1, U2; seed 42, 20 epochs) on ATT&CK-CWE: gold-free `neighborhood` only.
#   uv run cga run evaluate --dataset attack_cwe_unsup --experiment attack_cwe_unsup_smoke
evaluate:
  methods:
    - {method_id: u0,    label: "U0 frozen BERT",       kind: embedding_store, embedder_id: hf_mean_pool-bert_base, ref: latest}
    - {method_id: u1-s42, label: "U1 BERT + projection", kind: gcl_run, model_id: u1-s42, ref: latest}
    - {method_id: u2-s42, label: "U2 BERT + GCN",        kind: gcl_run, model_id: u2-s42, ref: latest}
  evaluations:
    - evaluation_id: neigh
      kind: neighborhood
      params:
        ks: [1, 5, 10]
        roles: [graph_1, graph_2]
        views:
          - {view_id: structural_r1, provider: hop_radius, params: {radius: 1}}
          - {view_id: textual, provider: cosine_top_k,
             params: {top_k: 10, reference: {kind: embedding_store, embedder_id: hf_mean_pool-bert_base, ref: latest}}}
