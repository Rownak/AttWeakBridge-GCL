# Sprint 6 Phase 6.1 -- A19 weight curve: w * A18 + (1 - w) * A17, w in {0, .25, .5, .75, 1}; val only. w=0 is A17, w=1 is A18.
#   uv run cga run evaluate --dataset ncit_doid_srga --experiment ncit_doid_srga_fusion_grid
evaluate:
  methods:
    - method_id: "A19-w0"
      label: "A19 w=0"
      kind: fusion
      members:
        - {kind: gcl_run, model_id: "srga-gcn-l0.25-s42", ref: latest, weight: 1}
        - {kind: gcl_run, model_id: "srga-gcn-l0.25-s43", ref: latest, weight: 1}
        - {kind: gcl_run, model_id: "srga-gcn-l0.25-s44", ref: latest, weight: 1}
    - method_id: "A19-w0.25"
      label: "A19 w=0.25"
      kind: fusion
      members:
        - {kind: gcl_run, model_id: "gcn-full-e200-s42", ref: latest, weight: 0.25}
        - {kind: gcl_run, model_id: "gcn-full-e200-s43", ref: latest, weight: 0.25}
        - {kind: gcl_run, model_id: "gcn-full-e200-s44", ref: latest, weight: 0.25}
        - {kind: gcl_run, model_id: "srga-gcn-l0.25-s42", ref: latest, weight: 0.75}
        - {kind: gcl_run, model_id: "srga-gcn-l0.25-s43", ref: latest, weight: 0.75}
        - {kind: gcl_run, model_id: "srga-gcn-l0.25-s44", ref: latest, weight: 0.75}
    - method_id: "A19-w0.5"
      label: "A19 w=0.5"
      kind: fusion
      members:
        - {kind: gcl_run, model_id: "gcn-full-e200-s42", ref: latest, weight: 0.5}
        - {kind: gcl_run, model_id: "gcn-full-e200-s43", ref: latest, weight: 0.5}
        - {kind: gcl_run, model_id: "gcn-full-e200-s44", ref: latest, weight: 0.5}
        - {kind: gcl_run, model_id: "srga-gcn-l0.25-s42", ref: latest, weight: 0.5}
        - {kind: gcl_run, model_id: "srga-gcn-l0.25-s43", ref: latest, weight: 0.5}
        - {kind: gcl_run, model_id: "srga-gcn-l0.25-s44", ref: latest, weight: 0.5}
    - method_id: "A19-w0.75"
      label: "A19 w=0.75"
      kind: fusion
      members:
        - {kind: gcl_run, model_id: "gcn-full-e200-s42", ref: latest, weight: 0.75}
        - {kind: gcl_run, model_id: "gcn-full-e200-s43", ref: latest, weight: 0.75}
        - {kind: gcl_run, model_id: "gcn-full-e200-s44", ref: latest, weight: 0.75}
        - {kind: gcl_run, model_id: "srga-gcn-l0.25-s42", ref: latest, weight: 0.25}
        - {kind: gcl_run, model_id: "srga-gcn-l0.25-s43", ref: latest, weight: 0.25}
        - {kind: gcl_run, model_id: "srga-gcn-l0.25-s44", ref: latest, weight: 0.25}
    - method_id: "A19-w1"
      label: "A19 w=1"
      kind: fusion
      members:
        - {kind: gcl_run, model_id: "gcn-full-e200-s42", ref: latest, weight: 1}
        - {kind: gcl_run, model_id: "gcn-full-e200-s43", ref: latest, weight: 1}
        - {kind: gcl_run, model_id: "gcn-full-e200-s44", ref: latest, weight: 1}
  evaluations:
    - evaluation_id: gold_val
      kind: gold_alignment
      params: {ks: [1, 5, 10], split: val, modes: [global]}
