# Sprint 4 Phase 4.4 -- retrieval of held-out gold NCIT->DOID test pairs. Run as:
#   cga run evaluate --dataset ncit_doid_supervised --experiment ncit_doid_gold_compare
#
# Needs the ncit_doid_supervised lineage (Phases 4.0-4.2): the copied embedding stores and the two
# models trained there. gcn_rank_topk_k5 is the unsupervised reference on the same held-out split;
# gcn_supervised trains on the gold train pairs (alpha=0.5; Phase 4.5 adds alpha=0.75, Phase 4.6 random text negatives). sapbert is the text-only bar to beat.
evaluate:
  methods:
    - {method_id: sapbert,          label: "SapBERT (text)",          kind: embedding_store, embedder_id: hf_mean_pool-sapbert,    ref: latest}
    - {method_id: bert_base,        label: "BERT-base (text)",        kind: embedding_store, embedder_id: hf_mean_pool-bert_base,  ref: latest}
    - {method_id: deepwalk,         label: "DeepWalk (graph)",        kind: embedding_store, embedder_id: deepwalk-deepwalk,       ref: latest}
    - {method_id: gcn_rank_topk_k5, label: "GCN rank_topk k=5",       kind: gcl_run,         model_id: gcn-rank_topk-k5,           ref: latest}
    - {method_id: gcn_supervised,   label: "GCN supervised",          kind: gcl_run,         model_id: gcn-supervised,             ref: latest}
    - {method_id: gcn_supervised_alpha0.75, label: "GCN supervised a=0.75", kind: gcl_run, model_id: gcn-supervised-alpha0.75, ref: latest}
    - {method_id: gcn_supervised_randneg, label: "GCN supervised rand-neg", kind: gcl_run, model_id: gcn-supervised-randneg, ref: latest}
  evaluations:
    - evaluation_id: gold
      kind: gold_alignment
      params: {ks: [1, 5, 10], split: test, modes: [global, candidates]}
