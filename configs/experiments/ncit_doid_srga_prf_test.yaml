# Sprint 8 Phase 8.2 -- BioGITOM-style P/R/F1 on TEST (3,280 pairs), read once, train-only lineage ncit_doid_srga.
#   uv run cga run evaluate --dataset ncit_doid_srga --experiment ncit_doid_srga_prf_test
# Filters on/off x greedy_one_to_one/top1 at threshold 0.0 (the comparable headline).
evaluate:
  methods:
    - {method_id: sapbert, label: "SapBERT (A0)", kind: embedding_store, embedder_id: hf_mean_pool-sapbert, ref: latest}
    - {method_id: "srga-nb-l0.25-dir", label: "A1 nb l=0.25 dir", kind: gcl_run, model_id: "srga-nb-l0.25-dir", ref: latest}
    - {method_id: "srga-mlp-l0.25-s42", label: "A3 MLP seed 42", kind: gcl_run, model_id: "srga-mlp-l0.25-s42", ref: latest}
    - {method_id: "srga-mlp-l0.25-s43", label: "A3 MLP seed 43", kind: gcl_run, model_id: "srga-mlp-l0.25-s43", ref: latest}
    - {method_id: "srga-mlp-l0.25-s44", label: "A3 MLP seed 44", kind: gcl_run, model_id: "srga-mlp-l0.25-s44", ref: latest}
    - {method_id: "srga-rel-l0.25-s42", label: "A4 relational seed 42", kind: gcl_run, model_id: "srga-rel-l0.25-s42", ref: latest}
    - {method_id: "srga-rel-l0.25-s43", label: "A4 relational seed 43", kind: gcl_run, model_id: "srga-rel-l0.25-s43", ref: latest}
    - {method_id: "srga-rel-l0.25-s44", label: "A4 relational seed 44", kind: gcl_run, model_id: "srga-rel-l0.25-s44", ref: latest}
    - {method_id: "srga-gcn-l0.25-s42", label: "A11 GCN seed 42", kind: gcl_run, model_id: "srga-gcn-l0.25-s42", ref: latest}
    - {method_id: "srga-gcn-l0.25-s43", label: "A11 GCN seed 43", kind: gcl_run, model_id: "srga-gcn-l0.25-s43", ref: latest}
    - {method_id: "srga-gcn-l0.25-s44", label: "A11 GCN seed 44", kind: gcl_run, model_id: "srga-gcn-l0.25-s44", ref: latest}
    - {method_id: "gcn-full-e200-s42", label: "A12 GCN no-floor seed 42", kind: gcl_run, model_id: "gcn-full-e200-s42", ref: latest}
    - {method_id: "gcn-full-e200-s43", label: "A12 GCN no-floor seed 43", kind: gcl_run, model_id: "gcn-full-e200-s43", ref: latest}
    - {method_id: "gcn-full-e200-s44", label: "A12 GCN no-floor seed 44", kind: gcl_run, model_id: "gcn-full-e200-s44", ref: latest}
    - {method_id: "srga-gat-l0.25-s42", label: "A14 GAT seed 42", kind: gcl_run, model_id: "srga-gat-l0.25-s42", ref: latest}
    - {method_id: "srga-gat-l0.25-s43", label: "A14 GAT seed 43", kind: gcl_run, model_id: "srga-gat-l0.25-s43", ref: latest}
    - {method_id: "srga-gat-l0.25-s44", label: "A14 GAT seed 44", kind: gcl_run, model_id: "srga-gat-l0.25-s44", ref: latest}
    - {method_id: "gat-full-e100-s42", label: "A15 GAT no-floor seed 42", kind: gcl_run, model_id: "gat-full-e100-s42", ref: latest}
    - {method_id: "gat-full-e100-s43", label: "A15 GAT no-floor seed 43", kind: gcl_run, model_id: "gat-full-e100-s43", ref: latest}
    - {method_id: "gat-full-e100-s44", label: "A15 GAT no-floor seed 44", kind: gcl_run, model_id: "gat-full-e100-s44", ref: latest}
    - method_id: "A17"
      label: "A17 seed ensemble of A11"
      kind: fusion
      members:
        - {kind: gcl_run, model_id: "srga-gcn-l0.25-s42", ref: latest, weight: 1}
        - {kind: gcl_run, model_id: "srga-gcn-l0.25-s43", ref: latest, weight: 1}
        - {kind: gcl_run, model_id: "srga-gcn-l0.25-s44", ref: latest, weight: 1}
    - method_id: "A18"
      label: "A18 seed ensemble of A12"
      kind: fusion
      members:
        - {kind: gcl_run, model_id: "gcn-full-e200-s42", ref: latest, weight: 1}
        - {kind: gcl_run, model_id: "gcn-full-e200-s43", ref: latest, weight: 1}
        - {kind: gcl_run, model_id: "gcn-full-e200-s44", ref: latest, weight: 1}
    - method_id: "A19"
      label: "A19 = 0.5 A18 + 0.5 A17"
      kind: fusion
      members:
        - {kind: gcl_run, model_id: "gcn-full-e200-s42", ref: latest, weight: 0.5}
        - {kind: gcl_run, model_id: "gcn-full-e200-s43", ref: latest, weight: 0.5}
        - {kind: gcl_run, model_id: "gcn-full-e200-s44", ref: latest, weight: 0.5}
        - {kind: gcl_run, model_id: "srga-gcn-l0.25-s42", ref: latest, weight: 0.5}
        - {kind: gcl_run, model_id: "srga-gcn-l0.25-s43", ref: latest, weight: 0.5}
        - {kind: gcl_run, model_id: "srga-gcn-l0.25-s44", ref: latest, weight: 0.5}
  evaluations:
    - {evaluation_id: prf_test_greedy_nofilt, kind: gold_alignment_prf, params: {split: test, assignment: greedy_one_to_one, biogitom_filters: false}}
    - {evaluation_id: prf_test_top1_nofilt, kind: gold_alignment_prf, params: {split: test, assignment: top1, biogitom_filters: false}}
    - {evaluation_id: prf_test_greedy_filt, kind: gold_alignment_prf, params: {split: test, assignment: greedy_one_to_one, biogitom_filters: true}}
    - {evaluation_id: prf_test_top1_filt, kind: gold_alignment_prf, params: {split: test, assignment: top1, biogitom_filters: true}}
    # Val-chosen thresholds (scripts/srga_prf_threshold.py on val, train-only models, filters on): A12 -> 0.60, A19 -> 0.55.
    # Labelled threshold-ablation rows; the comparable headline stays threshold 0.0.
    - {evaluation_id: prf_test_greedy_filt_thr0.60,   kind: gold_alignment_prf, params: {split: test, assignment: greedy_one_to_one, biogitom_filters: true,  threshold: 0.60}}
    - {evaluation_id: prf_test_greedy_filt_thr0.55,   kind: gold_alignment_prf, params: {split: test, assignment: greedy_one_to_one, biogitom_filters: true,  threshold: 0.55}}
    - {evaluation_id: prf_test_greedy_nofilt_thr0.60, kind: gold_alignment_prf, params: {split: test, assignment: greedy_one_to_one, biogitom_filters: false, threshold: 0.60}}
    - {evaluation_id: prf_test_greedy_nofilt_thr0.55, kind: gold_alignment_prf, params: {split: test, assignment: greedy_one_to_one, biogitom_filters: false, threshold: 0.55}}
