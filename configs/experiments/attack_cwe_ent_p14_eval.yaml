# Sprint 11 Phase 11.14 -- negative-sampling ablation for A0 / A1 / A2 (top_k = 5, InfoNCE), pool view, per-technique set metrics only.
#   uv run cga run evaluate --dataset attack_cwe_ent --experiment attack_cwe_ent_p14_eval --set evaluate.inputs.ingest_run=20261027T194643Z-5d3f8baf
