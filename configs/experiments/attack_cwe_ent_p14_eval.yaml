# Method id: <model>-<variant>-k5. nce = explicit bottom-5 negatives (11.13 reference, reused); pos = positive-only (in-batch negatives, loss
# infonce_inbatch); hard = cross-modal hard negatives (sampler s11c-rank_topk-k5-xhard, M = 50).
evaluate:
  methods:
    - {method_id: mpnet-chunk, label: "mpnet-chunk (frozen)", kind: embedding_store, embedder_id: sentence_transformer-multi_qa_mpnet_dot_chunk_desc, ref: 20261027T194928Z-8cf38e55}
