    - {method_id: a0-nce-k5, label: "A0 full dual, bottom-5 negatives (11.13)", kind: gcl_run, model_id: ent-dual-gcn-infonce-mpnetc-s42, ref: 20261027T205648Z-2aeb3259}
    - {method_id: a1-nce-k5, label: "A1 text-only GCN, bottom-5 negatives (11.13)", kind: gcl_run, model_id: ent-abl-text-gcn-nce-mpnetc-s42, ref: 20261027T232407Z-adc619c8}
    - {method_id: a2-nce-k5, label: "A2 graph-only GCN, bottom-5 negatives (11.13)", kind: gcl_run, model_id: ent-abl-graph-gcn-nce-mpnetc-s42, ref: 20261027T232541Z-d91ebd8e}
    - {method_id: a0-pos-k5, label: "A0 full dual, positive-only", kind: gcl_run, model_id: ent-p14-a0-pos-k5-mpnetc-s42, ref: 20261028T023713Z-eb4a8c99}
    - {method_id: a1-pos-k5, label: "A1 text-only GCN, positive-only", kind: gcl_run, model_id: ent-p14-a1-pos-k5-mpnetc-s42, ref: 20261028T024655Z-1bedbfd1}
