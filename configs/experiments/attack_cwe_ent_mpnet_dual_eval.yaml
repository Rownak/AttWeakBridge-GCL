# Sprint 11 Phase 11.11 -- dual-encoder GCNs on chunked mpnet text vectors (description-only text), the same-text SecRoBERTa control duals, and the
# 11.6 SecRoBERTa duals / frozen rows (older `description` text) as references. Same six evaluations as 11.9 / 11.10.
#   uv run cga run evaluate --dataset attack_cwe_ent --experiment attack_cwe_ent_mpnet_dual_eval #       --set evaluate.inputs.ingest_run=<11.10 ingest run of that source>
# All stores and models are pinned by run id (the mpnet triplet model has a bit-identical rerun, 20261027T210042Z-db28e05d). Cosine only.
evaluate:
  methods:
    - {method_id: ent-mpnet-chunk, label: "mpnet, chunked (frozen)", kind: embedding_store, embedder_id: sentence_transformer-multi_qa_mpnet_dot_chunk_desc, ref: 20261027T194928Z-8cf38e55}
    - {method_id: ent-d-mpnetc-trip, label: "Dual GCN, mpnet chunked, triplet", kind: gcl_run, model_id: ent-dual-gcn-triplet-mpnetc-s42, ref: 20261027T205615Z-db28e05d}
    - {method_id: ent-d-mpnetc-nce, label: "Dual GCN, mpnet chunked, InfoNCE", kind: gcl_run, model_id: ent-dual-gcn-infonce-mpnetc-s42, ref: 20261027T205648Z-2aeb3259}
    - {method_id: ent-srb-new, label: "SecRoBERTa, description only (frozen)", kind: embedding_store, embedder_id: hf_mean_pool-pt_SecRoBERTa_desc, ref: 20261027T200841Z-09088f9f}
    - {method_id: ent-d-srbd-trip, label: "Dual GCN, SecRoBERTa description only, triplet", kind: gcl_run, model_id: ent-dual-gcn-triplet-srbd-s42, ref: 20261027T205823Z-3a7bc511}
    - {method_id: ent-d-srbd-nce, label: "Dual GCN, SecRoBERTa description only, InfoNCE", kind: gcl_run, model_id: ent-dual-gcn-infonce-srbd-s42, ref: 20261027T205855Z-a209bd62}
    - {method_id: ent-s-r1, label: "SecRoBERTa (frozen, 11.9 text)", kind: embedding_store, embedder_id: hf_mean_pool-pt_SecRoBERTa, ref: 20261027T134403Z-8bc08adc}
    - {method_id: ent-d-trip, label: "Dual GCN, SecRoBERTa 11.9 text, triplet", kind: gcl_run, model_id: ent-dual-gcn-triplet-s42b, ref: 20261027T141524Z-5ac0fba7}
    - {method_id: ent-d-nce, label: "Dual GCN, SecRoBERTa 11.9 text, InfoNCE", kind: gcl_run, model_id: ent-dual-gcn-infonce-s42b, ref: 20261027T141732Z-3f70b1a2}
    - {method_id: ent-rand-s42, label: "Random ranking", kind: embedding_store, embedder_id: random-rand42, ref: latest}
    - {method_id: ent-rand-s43, label: "Random ranking", kind: embedding_store, embedder_id: random-rand43, ref: latest}
    - {method_id: ent-rand-s44, label: "Random ranking", kind: embedding_store, embedder_id: random-rand44, ref: latest}
  evaluations:
    - evaluation_id: gold_full
      kind: gold_alignment
      params: {ks: [1, 5, 10], split: test, modes: [global], sibling_filter_splits: [test]}
    - evaluation_id: prf_full
      kind: gold_alignment_prf
      params: {split: test, assignment: greedy_one_to_one, top_k: 3, threshold: 0.0, biogitom_filters: false}
    - evaluation_id: gold_pool
      kind: gold_alignment
      params: {ks: [1, 5, 10], split: test, modes: [global], sibling_filter_splits: [test], target_pool: data/processed/attack_cwe_ent/target_pool_union.json}
    - evaluation_id: prf_pool
      kind: gold_alignment_prf
      params: {split: test, assignment: greedy_one_to_one, top_k: 3, threshold: 0.0, biogitom_filters: false, target_pool: data/processed/attack_cwe_ent/target_pool_union.json}
    - evaluation_id: set_full
      kind: gold_set_retrieval
      params: {ks: [1, 5, 10, 15, 20, 50], split: test}
    - evaluation_id: set_pool
      kind: gold_set_retrieval
      params: {ks: [1, 5, 10, 15, 20, 50], split: test, target_pool: data/processed/attack_cwe_ent/target_pool_union.json}
