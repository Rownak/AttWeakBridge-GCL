# Sprint 9 (dev_docs/sprints/sprint_9.md): unsupervised, dataset-agnostic ablations on NCIT-DOID. Same graphs and text variants as
# ncit_doid_srga_full, but alignments are read only by `evaluate` (gold `test` pairs); `train` pairs are ingested for completeness and
# never used by training_data / gcl_train (guard: `protocol: unsupervised`) or by the evaluator's sibling filter (see
# configs/experiments/ncit_doid_unsup_test.yaml). No `val_split`: nothing is selected on anything.
# Ingest with an all-train node split so no node is held out because it is a gold endpoint:
#   uv run cga run ingest --dataset ncit_doid_unsup --set "ingest.split.fractions=[1.0,0.0,0.0]"
protocol: unsupervised
dataset:
  id: ncit_doid_unsup
  adapter: ncit_doid
  root: ${paths.raw}/ncit_doid
  graphs:
    graph_1: {key: ncit, display_name: "NCI Thesaurus"}
    graph_2: {key: doid, display_name: "Disease Ontology"}
  adapter_config:
    ncit:
      file: ncit.owl
      id_style: fragment             # IRI fragment after '#'
      edge_predicates: [rdfs:subClassOf]
      # ~Half of NCIT classes have no direct subClassOf; their parents are the named members
      # of an equivalentClass/intersectionOf definition (dev_docs/ncit_edge_extraction_analysis.md).
      edge_sources: [subClassOf, equivalent_intersection]
      predicate_map:                 # text role -> ontology-specific predicates
        label:      [rdfs:label]
        synonym:    [P90]
        definition: [P97, P325]
    doid:
      file: doid.owl
      id_style: fragment             # IRI fragment after the last '/'
      edge_predicates: [rdfs:subClassOf]
      predicate_map:
        label:      [rdfs:label]
        synonym:    ["oboInOwl:hasExactSynonym"]
        definition: ["obo:IAO_0000115"]   # not universal across DOID classes
    pruning:
      mode: none                     # none | alignment_reachable
  text_variants:
    label:                     [label]
    label_definition:          [label, definition]
    label_synonyms_definition: [label, synonym, definition]
  alignments:
    equivalence:
      train: refs_equiv/train.tsv
      test:  refs_equiv/test.tsv
      candidates: refs_equiv/test.cands.tsv
