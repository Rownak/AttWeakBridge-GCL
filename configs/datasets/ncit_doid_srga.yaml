# SRGA lineage (Sprint 5, dev_docs/sprints/sprint_5.md): ncit_doid_supervised plus a held-out val split
# carved from the gold train pairs (alignments.val_split), so nothing is tuned on test.
# Ingest with an all-train node split so held_out comes only from gold val/test endpoints:
#   uv run cga run ingest --dataset ncit_doid_srga --set "ingest.split.fractions=[1.0,0.0,0.0]"
dataset:
  id: ncit_doid_srga
  adapter: ncit_doid
  root: ${paths.raw}/ncit_doid
  graphs:
    graph_1: {key: ncit, display_name: "NCI Thesaurus"}
    graph_2: {key: doid, display_name: "Disease Ontology"}
  adapter_config:
    ncit:
      file: ncit.owl
      id_style: fragment             # IRI fragment after '#'
      edge_predicates: [rdfs:subClassOf]
      # ~Half of NCIT classes have no direct subClassOf; their parents are the named members
      # of an equivalentClass/intersectionOf definition (dev_docs/ncit_edge_extraction_analysis.md).
      edge_sources: [subClassOf, equivalent_intersection]
      predicate_map:                 # text role -> ontology-specific predicates
        label:      [rdfs:label]
        synonym:    [P90]
        definition: [P97, P325]
    doid:
      file: doid.owl
      id_style: fragment             # IRI fragment after the last '/'
      edge_predicates: [rdfs:subClassOf]
      predicate_map:
        label:      [rdfs:label]
        synonym:    ["oboInOwl:hasExactSynonym"]
        definition: ["obo:IAO_0000115"]   # not universal across DOID classes
    pruning:
      mode: none                     # none | alignment_reachable
  text_variants:
    label:                     [label]
    label_definition:          [label, definition]
    label_synonyms_definition: [label, synonym, definition]
  alignments:
    equivalence:
      train: refs_equiv/train.tsv
      test:  refs_equiv/test.tsv
      candidates: refs_equiv/test.cands.tsv
    val_split: {fraction: 0.15, seed: 42}   # sibling of `equivalence`; read by ingest, not the adapter
